apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailjet
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailjet-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["tailjet"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailjet-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailjet-leader-election
subjects:
  - kind: ServiceAccount
    name: tailjet
